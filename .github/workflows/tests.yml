name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libgc-dev clang guile-3.0
      - name: Run tests
        run: python3 tests/run_tests.py
      - name: Compare with guile
        run: python3 tests/run_against_guile.py
      - name: Run benchmarks
        run: python3 benchmarks/run_benchmarks.py
